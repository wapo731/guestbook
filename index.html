<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guestbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Guestbook</h1>
    <p class="lead">Leave a friendly note or signature for visitors.</p>

    <form id="guestbook-form" aria-label="Guestbook form">
      <div class="field">
        <label for="name">Name</label>
        <input id="name" name="name" type="text" maxlength="60" required placeholder="Your name">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" maxlength="1000" required placeholder="Write something nice..."></textarea>
      </div>
      <div class="actions">
        <button type="submit">Sign guestbook</button>
        <button type="button" id="clear-local">Clear this browser's entries</button>
      </div>
    </form>

    <section id="entries" aria-live="polite">
      <h2>Entries</h2>
      <ul id="entries-list"></ul>
    </section>

    <footer>
      <p class="muted">This is a static demo guestbook. Entries are saved only in your browser (localStorage).</p>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
