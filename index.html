<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Guestbook</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Guestbook</h1>
    <p class="lead">Leave a friendly note or signature!</p>

    <form id="guestbook-form" class="guestbook-form">
      <label>
        Your name
        <input type="text" id="name" placeholder="Your name (optional)">
      </label>
      <label>
        Message
        <textarea id="message" placeholder="Write a friendly note..." required></textarea>
      </label>
      <div class="controls">
        <button type="submit">Sign guestbook</button>
        <button type="button" id="clear">Clear all</button>
      </div>
    </form>

    <section>
      <h2>Messages</h2>
      <ul id="entries" class="entries"></ul>
      <p id="empty" class="empty">No messages yet — be the first!</p>
    </section>

    <footer>
      <small>Guestbook saved to your browser (localStorage). Export or host with GitHub Pages if you want public access.</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
